  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.25rem; }
  .tag { font-size:0.75rem; color:var(--muted); margin:2px 0 0; }
  select, input, button { font:inherit; }
  select { border:1px solid #cbd5e1; border-radius:8px; padding:6px 10px; background:#fff; }
  .btn { background:var(--primary); color:#fff; border:none; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; position:relative; }
  .btn:hover { background:#1d4ed8; }
  .btn-ghost { background:transparent; border:1px solid #e2e8f0; color:var(--text); }
  .btn-sm { padding:6px 10px; font-size:0.875rem; }
  .badge { position:absolute; top:-8px; inset-inline-end:-8px; background:#ef4444; color:#fff; font-size:11px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 40px; }
  label { display:block; font-size:0.875rem; font-weight:500; margin-bottom:6px; color:#334155; }
  .search { width:100%; border:1px solid #cbd5e1; border-radius:12px; padding:14px 16px; font-size:1.1rem; box-shadow:0 1px 2px rgb(0 0 0/0.04); }
  .search:focus { outline:2px solid var(--primary); outline-offset:2px; }
  .card { background:var(--card); border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; margin-bottom:12px; transition:box-shadow .15s; }

  .meta { font-size:0.8125rem; color:var(--muted); }
  .price-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  .price { font-size:1.15rem; font-weight:700; color:var(--ok); }
  .offer { font-size:0.7rem; background:#fef3c7; color:#92400e; padding:2px 8px; border-radius:999px; }
  .store-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-end:4px; vertical-align:middle; }
  .flex-between { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .expand { margin-top:14px; padding-top:14px; border-top:1px solid #f1f5f9; }
  .grid2 { display:grid; gap:8px; grid-template-columns:1fr; }
  @media(min-width:480px){ .grid2 { grid-template-columns:1fr 1fr; } }
  .store-btn { text-align:start; border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; background:#fff; cursor:pointer; width:100%; }
  .store-btn:hover { border-color:#93c5fd; }
  .store-btn.best { border-color:#34d399; background:#ecfdf5; }
  .store-btn .top { display:flex; justify-content:space-between; font-weight:600; }
  .store-btn .sub { font-size:0.75rem; color:var(--muted); margin-top:4px; }
  .empty { text-align:center; color:var(--muted); padding:48px 16px; }
  .total-box { background:var(--card); border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin-top:16px; display:flex; justify-content:space-between; align-items:center; font-size:1.15rem; font-weight:700; }
  .qty { display:flex; align-items:center; gap:4px; }
  .qty button { width:32px; height:32px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; cursor:pointer; }
  .link { color:var(--primary); text-decoration:none; font-size:0.875rem; }
  .link:hover { text-decoration:underline; }
  .danger { color:#dc2626; border:1px solid #fecaca; background:#fff; width:100%; border-radius:12px; padding:10px; margin-top:12px; cursor:pointer; }
  .danger:hover { background:#fef2f2; }

  .note { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:12px 14px; font-size:0.8125rem; color:#92400e; margin-bottom:16px; }
  .hidden { display:none !important; }
  .msg { color:var(--ok); font-size:0.875rem; font-weight:600; margin-top:8px; }

let selectedId = null;
let cart = [];

const CART_KEY = "matpris-cart-v1";
const LINKS_KEY = "matpris-links-v1";

function t(k) { return T[lang][k] || T.sv[k] || k; }
function fmt(n) { return n.toFixed(2).replace(".", ",") + " kr"; }
function getStore(id) { return DATA.stores.find(s => s.id === id); }
function getProduct(id) { return DATA.products.find(p => p.id === id); }
function bestPrice(p) {
  return p.prices.reduce((b, c) => c.price < b.price ? c : b);
}
function loadCart() {
  try { cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch { cart = []; }
}
function saveCart() { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
function loadLinks() {
  try { return JSON.parse(localStorage.getItem(LINKS_KEY) || "[]"); } catch { return []; }
}
function saveLinks(list) { localStorage.setItem(LINKS_KEY, JSON.stringify(list)); }

function search(q) {
  if (!q || q.trim().length < 1) return [];
  const s = q.trim().toLowerCase();
  return DATA.products.filter(p => {
    const name = lang === "ar" ? p.nameAr : p.name;
    return name.toLowerCase().includes(s) ||
      p.name.toLowerCase().includes(s) ||
      p.nameAr.includes(s) ||
      p.brand.toLowerCase().includes(s) ||
      (lang === "ar" ? p.categoryAr : p.category).toLowerCase().includes(s);
  }).slice(0, 12);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("appName").textContent = t("appName");
  document.getElementById("tagline").textContent = t("tagline");
  document.getElementById("searchHint").textContent = t("searchHint");
  document.getElementById("searchInput").placeholder = t("searchPlaceholder");
  document.getElementById("cartBtn").textContent = t("cart");
  document.getElementById("adminBtn").textContent = t("admin");
  document.getElementById("homeBtn").textContent = t("home");
  document.getElementById("cartTitle").textContent = t("cart");
  document.getElementById("backSearch").textContent = t("backToSearch");
  document.getElementById("cartEmpty").textContent = t("cartEmpty");
  document.getElementById("totalLabel").textContent = t("total");
  document.getElementById("clearCart").textContent = t("clearCart");
  document.getElementById("adminTitle").textContent = t("adminTitle");
  document.getElementById("adminHint").textContent = t("adminHint");
  document.getElementById("weeklyLinks").textContent = t("weeklyLinks");
  document.getElementById("urlInput").placeholder = t("pasteUrl");
  document.getElementById("addLinkBtn").textContent = t("addLink");
  document.getElementById("extractNote").textContent = t("extractNote");
  document.getElementById("lastUp").textContent =
    t("lastUpdated") + ": " + DATA.lastUpdated + " · " + DATA.products.length + " " + t("products");
  updateCartBadge();
  if (view === "search") renderResults();
  if (view === "cart") renderCart();
  if (view === "admin") renderAdmin();
}

function updateCartBadge() {
  const n = cart.reduce((s, i) => s + i.quantity, 0);
  const btn = document.getElementById("cartBtn");
  let badge = btn.querySelector(".badge");
  if (n > 0) {
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "badge";
      btn.appendChild(badge);
    }
    badge.textContent = n;
  } else if (badge) badge.remove();
}

function setView(v) {
  view = v;
  document.getElementById("searchView").classList.toggle("hidden", v !== "search");
  document.getElementById("cartView").classList.toggle("hidden", v !== "cart");
  document.getElementById("adminView").classList.toggle("hidden", v !== "admin");
  document.getElementById("adminBtn").classList.toggle("hidden", v === "admin");
  document.getElementById("homeBtn").classList.toggle("hidden", v !== "admin");
  if (v === "cart") renderCart();
  if (v === "admin") renderAdmin();
  if (v === "search") renderResults();
}

function renderResults() {
  const q = document.getElementById("searchInput").value;
  const list = search(q);
  const el = document.getElementById("results");
  const idle = document.getElementById("idleHint");
  idle.classList.toggle("hidden", q.length > 0);
  if (q.length > 0 && list.length === 0) {
    el.innerHTML = '<p class="empty">' + t("noResults") + "</p>";
    return;
  }
  el.innerHTML = list.map(p => {
    const best = bestPrice(p);
    const st = getStore(best.storeId);
    const name = lang === "ar" ? p.nameAr : p.name;
    const cat = lang === "ar" ? p.categoryAr : p.category;
    const expanded = selectedId === p.id;
    let storesHtml = "";
    if (expanded) {
      const sorted = p.prices.slice().sort((a, b) => a.price - b.price);
      storesHtml = '<div class="expand"><p class="meta" style="margin-bottom:8px;font-weight:600">' + t("chooseStore") + ":</p><div class=\"grid2\">" +
        sorted.map(pr => {
          const s = getStore(pr.storeId);
          const isBest = pr.storeId === best.storeId;
          return '<button type="button" class="store-btn' + (isBest ? " best" : "") + '" data-add="' + p.id + '" data-store="' + pr.storeId + '">' +
            '<div class="top"><span>' + (lang === "ar" ? s.nameAr : s.name) + '</span><span>' + fmt(pr.price) + '</span></div>' +
            '<div class="sub">' + pr.unitPrice + (pr.isOffer ? " · " + (pr.offerText || t("offer")) : "") + "</div></button>";
        }).join("") +
        '</div><button type="button" class="btn btn-ghost" style="width:100%;margin-top:10px" data-add="' + p.id + '">' +
        t("bestPrice") + " (" + fmt(best.price) + ")</button></div>";
    }
    return '<div class="card" data-id="' + p.id + '"><div class="flex-between">' +
      '<div style="flex:1;min-width:0"><h3>' + name + '</h3>' +
      '<p class="meta">' + p.brand + " · " + cat + " · " + p.unit + '</p>' +
      '<div class="price-row"><span class="price">' + fmt(best.price) + '</span>' +
      (best.isOffer ? '<span class="offer">' + t("offer") + (best.offerText ? " · " + best.offerText : "") + '</span>' : "") +
      '<span class="meta">@ ' + (lang === "ar" ? st.nameAr : st.name) + '</span></div></div>' +
      '<button type="button" class="btn btn-sm" data-select="' + p.id + '">' + t("addToCart") + '</button></div>' +
      storesHtml + "</div>";
  }).join("");
}

function renderCart() {
  const listEl = document.getElementById("cartList");
  const emptyEl = document.getElementById("cartEmpty");
  const totalBox = document.getElementById("cartTotalBox");
  const clearBtn = document.getElementById("clearCart");
  if (cart.length === 0) {
    listEl.innerHTML = "";
    emptyEl.classList.remove("hidden");
    totalBox.classList.add("hidden");
    clearBtn.classList.add("hidden");
    return;
  }
  emptyEl.classList.add("hidden");
  totalBox.classList.remove("hidden");
  clearBtn.classList.remove("hidden");
  let total = 0;
  listEl.innerHTML = cart.map(item => {
    const p = getProduct(item.productId);
    if (!p) return "";
    const pr = item.preferredStoreId
      ? (p.prices.find(x => x.storeId === item.preferredStoreId) || bestPrice(p))
      : bestPrice(p);
    const st = getStore(pr.storeId);
    const line = pr.price * item.quantity;
    total += line;
    const name = lang === "ar" ? p.nameAr : p.name;
    return '<div class="card"><div class="flex-between">' +
      '<div><h3>' + name + '</h3>' +
      '<p class="meta">' + fmt(pr.price) + " × " + item.quantity + " = <strong>" + fmt(line) + "</strong></p>" +
      '<p class="meta" style="margin-top:4px"><span class="store-dot" style="background:' + (st.color || "#666") + '"></span>' +
      (lang === "ar" ? st.nameAr : st.name) +
      (pr.isOffer ? ' <span class="offer">' + (pr.offerText || t("offer")) + '</span>' : "") +
      '</p></div><div style="text-align:end">' +
      '<div class="qty"><button type="button" data-qty="' + item.productId + '" data-d="-1">−</button>' +
      '<span style="width:28px;text-align:center;font-weight:600">' + item.quantity + '</span>' +
      '<button type="button" data-qty="' + item.productId + '" data-d="1">+</button></div>' +
      '<button type="button" class="link" style="margin-top:8px;color:#dc2626" data-rm="' + item.productId + '">' + t("remove") + '</button>' +
      '</div></div></div>';
  }).join("");
  document.getElementById("totalValue").textContent = fmt(total);
}

function renderAdmin() {
  const sel = document.getElementById("storeSelect");
  sel.innerHTML = DATA.stores.map(s =>
    '<option value="' + s.id + '">' + (lang === "ar" ? s.nameAr : s.name) + "</option>"
  ).join("");
  const links = loadLinks();
  const list = document.getElementById("linksList");
  if (links.length === 0) {
    list.innerHTML = '<p class="empty">' + t("noLinks") + "</p>";
    return;
  }
  list.innerHTML = links.map(l => {
    const st = getStore(l.storeId);
    return '<div class="card flex-between"><div style="min-width:0"><p style="margin:0;font-weight:600">' +
      (lang === "ar" ? st.nameAr : st.name) + '</p>' +
      '<a class="link" href="' + l.url + '" target="_blank" rel="noopener" style="word-break:break-all">' + l.url + '</a>' +
      '<p class="meta" style="margin-top:4px">' + new Date(l.addedAt).toLocaleString(lang === "ar" ? "ar" : "sv-SE") +
      '</p></div><button type="button" class="link" style="color:#dc2626" data-rmlink="' + l.id + '">' + t("remove") + '</button></div>';
  }).join("");
}

function addToCart(productId, storeId) {
  const existing = cart.find(i => i.productId === productId);
  if (existing) {
    existing.quantity += 1;
    if (storeId) existing.preferredStoreId = storeId;
  } else {
    cart.push({ productId, quantity: 1, preferredStoreId: storeId || null });
  }
  saveCart();
  updateCartBadge();
  selectedId = null;
  document.getElementById("searchInput").value = "";
  renderResults();
}

// Events
document.getElementById("langSelect").addEventListener("change", e => {
  lang = e.target.value;
  applyLang();
});
document.getElementById("searchInput").addEventListener("input", () => {
  selectedId = null;
  renderResults();
});
document.getElementById("cartBtn").addEventListener("click", () => setView("cart"));
document.getElementById("backSearch").addEventListener("click", () => setView("search"));
document.getElementById("adminBtn").addEventListener("click", () => setView("admin"));
document.getElementById("homeBtn").addEventListener("click", () => setView("search"));
document.getElementById("clearCart").addEventListener("click", () => {
  cart = [];
  saveCart();
  updateCartBadge();
  renderCart();
});
document.getElementById("addLinkBtn").addEventListener("click", () => {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return;
  const links = loadLinks();
  links.unshift({
    id: crypto.randomUUID(),
    storeId: document.getElementById("storeSelect").value,
    url,
    addedAt: new Date().toISOString()
  });
  saveLinks(links);
  document.getElementById("urlInput").value = "";
  const msg = document.getElementById("importMsg");
  msg.textContent = t("importSuccess");
  msg.classList.remove("hidden");
  setTimeout(() => msg.classList.add("hidden"), 2500);
  renderAdmin();
});

document.getElementById("results").addEventListener("click", e => {
  const sel = e.target.closest("[data-select]");
  if (sel) {
    selectedId = sel.getAttribute("data-select");
    renderResults();
    return;
  }
  const add = e.target.closest("[data-add]");
  if (add) {
    addToCart(add.getAttribute("data-add"), add.getAttribute("data-store") || null);
  }
});

document.getElementById("cartList").addEventListener("click", e => {
  const qty = e.target.closest("[data-qty]");
  if (qty) {
    const id = qty.getAttribute("data-qty");
    const d = parseInt(qty.getAttribute("data-d"), 10);
    const item = cart.find(i => i.productId === id);
    if (!item) return;
    item.quantity += d;
    if (item.quantity <= 0) cart = cart.filter(i => i.productId !== id);
    saveCart();
    updateCartBadge();
    renderCart();
    return;
  }
  const rm = e.target.closest("[data-rm]");
  if (rm) {
    cart = cart.filter(i => i.productId !== rm.getAttribute("data-rm"));
    saveCart();
    updateCartBadge();
    renderCart();
  }
});

document.getElementById("linksList").addEventListener("click", e => {
  const rm = e.target.closest("[data-rmlink]");
  if (rm) {
    const links = loadLinks().filter(l => l.id !== rm.getAttribute("data-rmlink"));
    saveLinks(links);
    renderAdmin();
  }
});

// Init
loadCart();
applyLang();
renderResults();
</script>
</body>
</html>
